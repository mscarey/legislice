[project]
name = "legislice"
authors = [
    {name = "Matt Carey", email = "matt@authorityspoke.com"},
]
license-files = ["license.md"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
]
readme = "README.rst"
requires-python = ">=3.13"
dependencies = [
    "anchorpoint==0.9.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "roman>=5.2",
]

[dependency-groups]
build = [
    "build",
    "twine",
]
dev = [
    "pytest-cov>=7.1.0",
    "pytest>=9.0.3",
    "pytest-recording>=0.13.4",
]
docs = [
    "sphinx-autodoc-typehints>=3.17.2",
    "sphinx>=9.1.0",
    "sphinx-rtd-theme>=3.1.0",
]
